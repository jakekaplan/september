[workspace]
members = ["crates/memory", "crates/service"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
